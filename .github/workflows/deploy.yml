name: CI/CD Pipeline

# Validation runs on every pull request; the deploy job runs on develop and main.
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

# id-token is granted per-job (deploy only), not workflow-wide.
permissions:
  contents: read

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  AWS_ACCOUNT_ID: "691537867581"
  # The only switch for choosing a target environment. The ECR repository, the ECR
  # stack and every CDK stack name are *derived* from it by the `resolve-environment`
  # job below -- do not add ECR_REPOSITORY or ECR_STACK back here, it rejects them
  # (issue #54). Promoting to prod is one line: see docs/deployment.md.
  CDK_ENVIRONMENT: dev
  IMAGE_TAG: ${{ github.sha }}
  NODE_VERSION: "24"

jobs:
  resolve-environment:
    name: Resolve target environment
    runs-on: ubuntu-latest

    outputs:
      name: ${{ steps.resolve.outputs.name }}
      ecr_stack: ${{ steps.resolve.outputs.ecr_stack }}
      ecr_repository: ${{ steps.resolve.outputs.ecr_repository }}
      stacks: ${{ steps.resolve.outputs.stacks }}

    steps:
      - uses: actions/checkout@v7

      # infra/hello-cdk/lib/environments.json is the same file bin/hello-cdk.ts reads,
      # so the pipeline and the CDK app cannot disagree about which repository belongs
      # to which environment. An unknown CDK_ENVIRONMENT fails here, before anything
      # is built, instead of 15 minutes later in cdk deploy.
      - name: Derive ECR stack and repository
        id: resolve
        run: |
          node .github/scripts/resolve-environment.mjs \
            infra/hello-cdk/lib/environments.json \
            "$CDK_ENVIRONMENT" >> "$GITHUB_OUTPUT"

      - name: Report the selected environment
        run: |
          echo "::notice title=Target environment::${{ steps.resolve.outputs.name }} -> ${{ steps.resolve.outputs.ecr_stack }} / ${{ steps.resolve.outputs.ecr_repository }}"
          {
            echo "### Target environment: \`${{ steps.resolve.outputs.name }}\`"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| ECR stack | \`${{ steps.resolve.outputs.ecr_stack }}\` |"
            echo "| ECR repository | \`${{ steps.resolve.outputs.ecr_repository }}\` |"
            echo "| CDK stacks | \`${{ steps.resolve.outputs.stacks }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  test-backend:
    name: Backend build & tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: cloudsheet
          POSTGRES_PASSWORD: cloudsheet
          POSTGRES_DB: cloudsheet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cloudsheet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # 127.0.0.1, not localhost: Node >=17 resolves localhost to ::1 first, but the
      # postgres service container only publishes its port on IPv4 -> ECONNREFUSED ::1:5432.
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_USERNAME: cloudsheet
      DB_PASSWORD: cloudsheet
      DB_NAME: cloudsheet
      DB_SSL: "false"
      FRONTEND_URL: http://127.0.0.1:8080 
      NODE_ENV: test
      AUTH_BYPASS: "true"
      # verifyUser.ts builds the Cognito verifier lazily, but aws-jwt-verify still
      # validates the pool id format as soon as a token is verified. Format-valid
      # dummies keep the module usable without real Cognito configuration.
      COGNITO_USER_POOL_ID: eu-central-1_Test12345
      COGNITO_CLIENT_ID: testclientid
      COGNITO_DOMAIN: https://example.invalid

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      # tsconfig.json sets "noEmit": true, so this is a type check, not a build.
      - name: Type check
        working-directory: backend
        run: npm run build

      # knex loads migration files with a dynamic import(). Run through tsx that
      # resolves .ts fine, but vitest treats knex as an external dependency, so the
      # same import goes straight to Node's ESM loader, which rejects .ts with
      # 'Unknown file extension'. The postgres service starts empty, so every
      # migration would be pending and tests/setup.ts would hit exactly that.
      # Applying them here first leaves nothing pending for setup.ts to import.
      - name: Run migrations
        working-directory: backend
        run: npm run migrate:latest

      # The suite in backend/tests is integration-style: it talks to a real server
      # over HTTP (supertest against TEST_SERVER_URL) and a real Postgres.
      # Seeds are still applied by tests/setup.ts itself.
      - name: Start backend server
        working-directory: backend
        run: |
          npx tsx src/index.ts > server.log 2>&1 &
          echo $! > server.pid
          npx wait-port 127.0.0.1:8080 -t 60000

      - name: Run tests
        working-directory: backend
        run: npm run test:ci

      - name: Dump server log on failure
        if: failure()
        working-directory: backend
        run: cat server.log || true

      - name: Stop backend server
        if: always()
        working-directory: backend
        run: |
          if [ -f server.pid ]; then kill "$(cat server.pid)" || true; fi

  build-frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

      # FrontendStack reads frontend/dist via s3deploy.Source.asset(), so cdk synth
      # in the deploy job fails without this artifact.
      - name: Upload frontend build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
          if-no-files-found: error

  build-image:
    name: Backend image build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Build without pushing so a broken container fails the pull request
      # instead of surfacing only on a push to main.
      - name: Build backend image
        run: docker build --tag cloudsheets-backend:ci ./backend

  test-infra:
    name: CDK build & tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: infra/hello-cdk/package-lock.json

      - name: Install dependencies
        working-directory: infra/hello-cdk
        run: npm ci

      - name: Build
        working-directory: infra/hello-cdk
        run: npm run build

      # Synth-only assertions, no AWS credentials required. test/environment.test.ts
      # covers the dev and prod mapping and fails if this workflow starts hardcoding
      # repository names again.
      - name: Test
        working-directory: infra/hello-cdk
        run: npm test -- --runInBand

  synth-environments:
    name: CDK synth (${{ matrix.environment }})
    runs-on: ubuntu-latest
    # FrontendStack pulls frontend/dist through s3deploy.Source.asset(), so the app
    # cannot be synthesized before the frontend is built.
    needs: [build-frontend]

    strategy:
      # Both environments are reported even when one of them breaks.
      fail-fast: false
      matrix:
        environment: [dev, prod]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: infra/hello-cdk/package-lock.json

      - name: Download frontend build
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Install dependencies
        working-directory: infra/hello-cdk
        run: npm ci

      - name: Synthesize
        working-directory: infra/hello-cdk
        run: npx cdk synth --all -c environment=${{ matrix.environment }} -o cdk.out --quiet

      # Deriving the names makes them consistent on paper; this checks the templates
      # CloudFormation would actually receive -- the repository the image is pushed
      # to, the repository the ECS service pulls from, the frontend bucket, and the
      # absence of any stack belonging to the other environment.
      - name: Assert the app contains only ${{ matrix.environment }} infrastructure
        run: |
          node .github/scripts/assert-environment-synth.mjs \
            infra/hello-cdk/lib/environments.json \
            "${{ matrix.environment }}" \
            infra/hello-cdk/cdk.out

  deploy:
    name: Push image & deploy infrastructure
    runs-on: ubuntu-latest
    needs: [resolve-environment, test-backend, build-frontend, build-image, test-infra, synth-environments]
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')

    # Binds the run to the GitHub environment of the same name. Its protection rules
    # apply before the first step: with required reviewers configured, the job waits
    # for an approval instead of deploying on merge. The name is derived like
    # everything else, so `CDK_ENVIRONMENT: prod` also switches to the prod reviewers
    # and the prod environment secrets (issue #54).
    environment:
      name: ${{ needs.resolve-environment.outputs.name }}
      # Makes the deployed endpoint clickable in the repository's Environments tab.
      url: ${{ steps.endpoint.outputs.url }}

    permissions:
      contents: read
      id-token: write # OIDC federation with AWS

    env:
      # Derived once in the `resolve-environment` job, never typed here. Changing
      # CDK_ENVIRONMENT at the top of this file moves all of them together.
      CDK_ENVIRONMENT: ${{ needs.resolve-environment.outputs.name }}
      ECR_STACK: ${{ needs.resolve-environment.outputs.ecr_stack }}
      ECR_REPOSITORY: ${{ needs.resolve-environment.outputs.ecr_repository }}
      CDK_STACKS: ${{ needs.resolve-environment.outputs.stacks }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: infra/hello-cdk/package-lock.json

      - name: Announce the deployment target
        run: |
          echo "::notice title=Deploying::environment=$CDK_ENVIRONMENT repository=$ECR_REPOSITORY stacks=$CDK_STACKS tag=$IMAGE_TAG"
          echo "Deploying environment '$CDK_ENVIRONMENT' from ${GITHUB_REF#refs/heads/}"
          echo "  ECR stack:      $ECR_STACK"
          echo "  ECR repository: $ECR_REPOSITORY"
          echo "  CDK stacks:     $CDK_STACKS"

      - name: Download frontend build
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}

      - name: Install CDK dependencies
        working-directory: infra/hello-cdk
        run: npm ci

      # The repository has to exist before docker push. Only the ECR stack of the
      # selected environment is part of the synthesized app, so a mismatched pair
      # fails here with "no stack found" instead of creating the wrong registry.
      - name: Ensure ECR repository exists
        working-directory: infra/hello-cdk
        run: npx cdk deploy "$ECR_STACK" --context environment="$CDK_ENVIRONMENT" --require-approval never

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "Pushing to $ECR_REGISTRY/$ECR_REPOSITORY ($CDK_ENVIRONMENT)"
          docker build \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            ./backend
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      # Deploys BackendStack (RDS), FrontendStack (S3/CloudFront/Cognito), the ECR
      # stack of this environment and EcsExpressStack -- and nothing belonging to the
      # other environment, since bin/hello-cdk.ts only instantiates one set.
      # Cross-stack references determine the order.
      - name: Deploy infrastructure
        working-directory: infra/hello-cdk
        run: |
          npx cdk deploy --all \
            --context environment="$CDK_ENVIRONMENT" \
            --context backendImageTag="$IMAGE_TAG" \
            --require-approval never \
            --outputs-file cdk-outputs.json

      - name: Resolve service endpoint
        id: endpoint
        working-directory: infra/hello-cdk
        run: |
          # cdk-outputs.json is keyed by stack name, and that name carries the
          # environment. Picked out of the resolved list rather than rebuilt here,
          # so the suffix stays in exactly one place (issue #54).
          ECS_STACK=$(printf '%s\n' $CDK_STACKS | grep '^EcsExpressStack' | head -1)
          ENDPOINT=$(ECS_STACK="$ECS_STACK" node -e "const o=require('./cdk-outputs.json');const s=o[process.env.ECS_STACK];process.stdout.write((s&&s.EcsExpressEndpoint)||'')")
          if [ -z "$ENDPOINT" ]; then
            echo "EcsExpressEndpoint missing from cdk-outputs.json for stack $ECS_STACK" >&2
            exit 1
          fi
          case "$ENDPOINT" in
            http://*|https://*) ;;
            *) ENDPOINT="https://$ENDPOINT" ;;
          esac
          echo "url=${ENDPOINT%/}" >> "$GITHUB_OUTPUT"

      # A green cdk deploy only means CloudFormation succeeded, not that the
      # container actually serves traffic. Probe /health before declaring success.
      - name: Smoke test /health
        run: |
          URL="${{ steps.endpoint.outputs.url }}/health"
          for i in $(seq 1 20); do
            if curl -fsS --max-time 10 "$URL"; then
              echo "Health check passed on attempt $i"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 15s..."
            sleep 15
          done
          echo "Health check never succeeded at $URL" >&2
          exit 1

      # cdk.out is still not uploaded as an artifact. Since #20 the DB credentials no
      # longer reach the ECS template (they are injected from SSM Parameter Store at
      # task start), but the synthesized BackendStack template legitimately contains
      # the RDS {{resolve:secretsmanager:...}} reference, so there is nothing to gain
      # from publishing it.
      - name: Job summary
        if: always()
        run: |
          {
            echo "### Deployment"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Environment | \`$CDK_ENVIRONMENT\` |"
            echo "| Branch | \`${GITHUB_REF#refs/heads/}\` |"
            echo "| ECR stack | \`$ECR_STACK\` |"
            echo "| ECR repository | \`$ECR_REPOSITORY\` |"
            echo "| CDK stacks | \`$CDK_STACKS\` |"
            echo "| Image tag | \`$IMAGE_TAG\` |"
            echo "| Endpoint | ${{ steps.endpoint.outputs.url }} |"
          } >> "$GITHUB_STEP_SUMMARY"
